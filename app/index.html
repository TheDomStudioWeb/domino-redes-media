<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DOMino Redes</title>
<meta name="theme-color" content="#0a0a0a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{--bg:#f1eee3;--surface:#faf8f2;--raised:#e6e1d2;--ink:#0a0a0a;--muted:#4f4b41;--gold:#d4af37;--gold-text:#7a5f0e;--hair:#7a5f0e40;--on-gold:#0a0a0a;--sin:#a82019;--con:#1b6e3c;--proc:#0a6c80;--shadow:0 8px 24px #0000001f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--surface:#16181c;--raised:#1f2227;--ink:#f4f1ea;--muted:#a8a396;--gold-text:#d4af37;--hair:#d4af3740;--sin:#ff6b61;--con:#4cc38a;--proc:#22d3ee;--shadow:0 8px 24px #00000066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--surface:#16181c;--raised:#1f2227;--ink:#f4f1ea;--muted:#a8a396;--gold-text:#d4af37;--hair:#d4af3740;--sin:#ff6b61;--con:#4cc38a;--proc:#22d3ee;--shadow:0 8px 24px #00000066;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:Cinzel,"Trajan Pro",Georgia,serif;letter-spacing:.03em;margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700}h2{font-size:18px;font-weight:600}h3{font-size:15px;font-weight:600}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--hair)}
header img{width:48px;height:48px;border-radius:9999px}
.cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.sp{flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0}
button,select,input,textarea{font:inherit;color:inherit}button,.tab,.btn,.piece{touch-action:manipulation}
.tab,.btn{background:transparent;border:1px solid var(--hair);padding:8px 12px;border-radius:2px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;min-height:36px}
.tab[aria-current="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.pri{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.ok{border-color:var(--con);color:var(--con)}.btn.bad{border-color:var(--sin);color:var(--sin)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:14px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat b{font:700 26px Cinzel,Georgia,serif;display:block;color:var(--gold-text)}
.stat.al b{color:var(--sin)}
.alert{border:1px solid var(--sin);border-left-width:4px;border-radius:6px;padding:10px 12px;background:var(--surface);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert.w{border-color:var(--gold-text)}
.alert .t{flex:1;min-width:200px}
.day{margin-top:18px}
.day h3{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:8px}
.piece{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-bottom:8px;cursor:pointer;text-align:left;width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:6px}
.piece .m{flex:1;min-width:180px}
.pill{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:2px 8px;border:1px solid var(--hair);border-radius:9999px;white-space:nowrap}
.pill.ok{color:var(--con);border-color:var(--con)}.pill.bad{color:var(--sin);border-color:var(--sin)}.pill.gold{color:var(--gold-text);border-color:var(--gold-text)}.pill.pr{color:var(--proc);border-color:var(--proc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--raised);border:1px solid var(--hair);border-radius:2px;padding:8px 10px;min-height:38px}
textarea{min-height:120px;resize:vertical}
.two{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.modal{display:block}
.modal>.card{width:100%;max-width:640px;margin:0 auto;box-shadow:var(--shadow)}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair)}
.chk input{width:auto;min-height:0}.chk span{flex:1}
.muted{color:var(--muted)}.sm{font-size:12px}
.sig{margin-top:36px;padding-top:12px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted);text-align:center}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--hair);border-radius:6px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--hair);vertical-align:top}
.scroll{overflow-x:auto}.gal{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));margin-top:8px}.th{position:relative;border:1px solid var(--hair);border-radius:2px;background:var(--raised)}.th.vid{grid-column:span 2}.th video{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#000}.th img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.th button{position:absolute;top:2px;right:2px;padding:2px 6px;min-height:0;background:var(--bg)}.th a{display:block}.up{color:var(--con)}.dn{color:var(--sin)}
</style>

function clientes(){var o=[];ST.cuentas.forEach(function(c){if(c.cliente&&o.indexOf(c.cliente)<0)o.push(c.cliente)});return o}
function cliOk(n){return CLI==='todos'||String(n||'').trim().toLowerCase()===CLI.trim().toLowerCase()}
function SP(){return ST.piezas.filter(function(p){var c=cuenta(p.cuenta);return CLI==='todos'||(c&&cliOk(c.cliente))})}

function isVid(x){return /\.(mp4|mov|webm)$/i.test((x&&x.name)||'')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s,r){return (r||document).querySelector(s)}

  var a=[],hoy=hoyIso();
  SP().forEach(function(p){
    if(atrasada(p))a.push({k:'bad',p:p,t:(p.estado==='fallida'?'No se pudo subir: ':'Sin confirmar la subida: ')+esc(p.titulo)+' ('+esc(cname(p.cuenta))+', era para '+esc(fmt(p.fecha))+' '+esc(p.hora||'')+')'});
    else if(p.estado==='aprobada'&&p.fecha===hoy&&isManual(p))a.push({k:'w',p:p,t:'Hoy hay que subir a mano: '+esc(p.titulo)+' a las '+esc(p.hora||'')+' ('+esc(cname(p.cuenta))+')'});

  });

function stamp(d){return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'}

function ie(t){return String(t).split('\\').join('\\\\').split(',').join('\\,').split(';').join('\\;').split(String.fromCharCode(13)).join('').split(String.fromCharCode(10)).join('\\n')}

}
async function dlIcs(){

}

    if(s==='publicada'){p2.publicadoTs=Date.now();p2.motivo=''}
    if(s==='fallida'&&!(p2.motivo||'').trim()){p2.motivo='Sin motivo indicado'}
    if(s==='aprobar'&&pend(p2)){p2.estado='validar'}
    if(savePieza())OPEN=null;
  }
  else if(act==='ncuenta'){OPEN={t:'cuenta',nuevo:true,c:{id:newId('c'),cliente:(CLI==='todos'?'':CLI),red:'Instagram',handle:'',estado:'activa',modo:'manual',notas:''}}}
  else if(act==='ecuenta'){var c=cuenta(id);if(c)OPEN={t:'cuenta',c:JSON.parse(JSON.stringify(c))}}
  else if(act==='gcuenta'){var c3=OPEN.c;c3.cliente=$('#c-cli').value.trim();c3.red=$('#c-red').value;c3.handle=$('#c-h').value.trim();c3.estado=$('#c-est').value;c3.modo=$('#c-modo').value;c3.notas=$('#c-n').value;
    if(!c3.cliente){ERR='Falta el nombre del cliente.'}else{wr('cuentas',c3.id,{cliente:c3.cliente,red:c3.red,handle:c3.handle,estado:c3.estado,modo:c3.modo,notas:c3.notas},false);var j=ST.cuentas.map(function(x){return x.id}).indexOf(c3.id);if(j<0)ST.cuentas.push(c3);else ST.cuentas[j]=c3;OPEN=null}}
  else if(act==='xcuenta'){var cid=OPEN.c.id;if(ST.piezas.some(function(p){return p.cuenta===cid})){ERR='Esa cuenta tiene piezas. Movelas o eliminalas antes.'}else{if(DB)DB.doc('cuentas/'+cid).delete().catch(function(){});ST.cuentas=ST.cuentas.filter(function(x){return x.id!==cid});OPEN=null}}
  else if(act==='nmet'){OPEN={t:'met'}}
  else if(act==='gmet'){var md={cuenta:$('#m-c').value,semana:$('#m-s').value,t:Date.now()};MET.forEach(function(x){var v=$('#m-'+x[0]).value;if(v!=='')md[x[0]]=+v});
    if(!md.cuenta||!md.semana){ERR='Falta la cuenta o la semana.'}else{var mid=newId('m');wr('metricas',mid,md,false);md.id=mid;ST.metricas.push(md);OPEN=null}}
  else if(act==='xmet'){if(DB)DB.doc('metricas/'+id).delete().catch(function(){});ST.metricas=ST.metricas.filter(function(x){return x.id!==id})}
  else if(act==='ndato'){OPEN={t:'dato'}}
  else if(act==='gdato'){var tx2=$('#d-t').value.trim();if(tx2){var nid=newId('d');var dd={texto:tx2,cliente:$('#d-c').value.trim(),quien:$('#d-q').value.trim(),estado:'pendiente',t:Date.now()};wr('datos',nid,dd,false);dd.id=nid;ST.datos.push(dd);OPEN=null}}
  else if(act==='tdato'){var d2=ST.datos.filter(function(x){return x.id===id})[0];if(d2){d2.estado=d2.estado==='validado'?'pendiente':'validado';wr('datos',id,{estado:d2.estado,t:Date.now()},true)}}
  else if(act==='xdato'){if(DB)DB.doc('datos/'+id).delete().catch(function(){});ST.datos=ST.datos.filter(function(x){return x.id!==id})}
  render();
});
document.addEventListener('change',function(ev){var t=ev.target;if(t.id==='f-files'&&AS&&OPEN&&OPEN.p){upFiles(t.files);return}if(t.getAttribute&&t.getAttribute('data-act')==='vok'&&OPEN&&OPEN.p){readPieza();OPEN.p.validar[+t.getAttribute('data-i')].ok=t.checked;render()}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&OPEN){OPEN=null;render()}});
async function upFiles(files){
  readPieza();var list=Array.prototype.slice.call(files||[]),ok=0;
  for(var i=0;i<list.length;i++){MSG='Subiendo '+(i+1)+' de '+list.length+'…';render();
    try{var r=await AS.upload(list[i]);OPEN.p.imgs=(OPEN.p.imgs||[]).concat([{id:r.id,name:list[i].name}]);ok++}catch(e){MSG='No se pudo subir '+list[i].name+' ('+((e&&e.code)||'error')+').';render();return}}
  if(!OPEN.nuevo)wr('piezas',OPEN.p.id,{imgs:OPEN.p.imgs},true);
  MSG=ok+' imagen(es) subida(s).';render();
}
async function dlAll(){
  var im=(OPEN&&OPEN.p&&OPEN.p.imgs)||[];if(!DL||!im.length)return;
  for(var i=0;i<im.length;i++){
    try{var b=await MEDIA.blob(im[i].id);var nm=im[i].name||('lamina-'+(i+1)+'.png');await DL.save({filename:nm,data:b})}
    catch(e){MSG=(e&&e.code==='declined')?'Descarga cancelada.':'No se pudo descargar acá. Abrí cada imagen y guardala.';render();return}}
  MSG='Descarga lista.';render();
}
var MET=[['seguidores','Seguidores'],['guardados','Guardados'],['compartidos','Compartidos'],['comentarios','Comentarios'],['dms','Mensajes directos'],['visitas','Visitas al perfil'],['clics','Clics en el enlace']];
function vMetricas(){
  var h='<div class="row"><h2>Métricas semanales</h2><span class="sp"></span><button class="btn pri" data-act="nmet">+ Cargar semana</button></div><p class="muted">Cargá los números de cada lunes. Las flechas comparan con la semana anterior de la misma cuenta.</p>';
  if(!SM().length)return h+'<div class="empty">Todavía no hay semanas cargadas. La primera medición es el lunes 2/11.</div>';
  var by={};SM().forEach(function(m){(by[m.cuenta]=by[m.cuenta]||[]).push(m)});
  Object.keys(by).forEach(function(cid){
    var ms=by[cid].sort(function(a,b){return String(a.semana).localeCompare(String(b.semana))});
    h+='<h3 style="margin-top:18px">'+esc(cname(cid))+'</h3><div class="scroll"><table><tr><th>Semana del</th>'+MET.map(function(x){return '<th>'+x[1]+'</th>'}).join('')+'<th></th></tr>';
    ms.forEach(function(m,i){var pr=ms[i-1];h+='<tr><td>'+esc(fmt(m.semana))+'</td>'+MET.map(function(x){var v=m[x[0]],pv=pr?pr[x[0]]:null;var d='';if(pv!=null&&v!=null&&v!==pv){d=' <span class="'+(v>pv?'up':'dn')+'">'+(v>pv?'▲':'▼')+Math.abs(v-pv)+'</span>'}return '<td>'+(v==null?'—':esc(v))+d+'</td>'}).join('')+'<td><button class="btn" data-act="xmet" data-id="'+esc(m.id)+'" aria-label="Quitar semana">✕</button></td></tr>'});
    h+='</table></div>'});
  return h;
}
function snap(col,key,sortf){DB.collection(col).onSnapshot(function(s){ST[key]=s.docs.map(function(d){var v=Object.assign({},d.data()||{});v.id=d.id;return v});if(sortf)ST[key].sort(sortf);LOADED=true;DIAG.snaps++;DIAG.last=new Date().toLocaleTimeString('es-AR');if(!(OPEN&&document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))){clearTimeout(RT);RT=setTimeout(render,250)}},function(e){ERR='No se pudieron leer los datos ('+((e&&e.code)||'error')+').';LOADED=true;render()})}
var _render=render;render=function(){_render();try{window.DRHYDRATE&&window.DRHYDRATE()}catch(e){}};
window.DRSTATE=function(){return {open:!!OPEN}};
window.DRBOOT=function(env){USER=env.user;DB=env.db;AS=env.as;DL=env.dl;CAN=true;ERR='';
  snap('cuentas','cuentas',function(a,b){return (a.orden||99)-(b.orden||99)});snap('piezas','piezas');snap('datos','datos');snap('metricas','metricas');render();
  setTimeout(function(){if(!LOADED){LOADED=true;ERR='No llegaron los datos. Revisá tu conexión y recargá.';render()}},12000)};
window.DRSHOW=function(html){var a=document.getElementById('app');if(a)a.innerHTML=html};
setInterval(function(){if(!OPEN)render()},60000);
})();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,doc,setDoc,updateDoc,deleteDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDGtnYkVh21alME47hNbdaWowACq4UAbpI",authDomain:"domino-redes.firebaseapp.com",projectId:"domino-redes",storageBucket:"domino-redes.firebasestorage.app",messagingSenderId:"91643037744",appId:"1:91643037744:web:71539b9c399755eaf2c5f5"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app);
const GH_REPO="TheDomStudioWeb/domino-redes",GH_DIR="media/";
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let started=false;

/* ---- Base de datos (misma interfaz que usa la app) ---- */
const DB={
  doc:p=>{const r=doc(fs,...p.split('/'));return{set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)}},
  collection:c=>({onSnapshot:(ok,er)=>onSnapshot(collection(fs,c),s=>ok({docs:s.docs}),er)})
};

/* ---- Imágenes y videos en GitHub (repo privado) ---- */
const tok=()=>{try{return localStorage.getItem('dr_gh')||''}catch(e){return''}};
const hdr=(extra)=>Object.assign({Authorization:'Bearer '+tok(),'X-GitHub-Api-Version':'2022-11-28'},extra||{});
const cache={};
const MEDIA={
  async blob(id){
    if(cache[id])return cache[id];
    if(!tok()){askToken();throw{code:'sintoken'}}
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_DIR}${encodeURIComponent(id)}`,{headers:hdr({Accept:'application/vnd.github.raw+json'})});
    if(!r.ok){if(r.status===401||r.status===403)askToken();throw{code:'http'+r.status}}
    const b=await r.blob();cache[id]=b;return b;
  },
  async upload(file){
    if(!tok()){askToken();throw{code:'sintoken'}}
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    const b64=await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]);f.onerror=()=>rej({code:'lectura'});f.readAsDataURL(file)});
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_DIR}${id}`,{method:'PUT',headers:hdr({'Content-Type':'application/json',Accept:'application/vnd.github+json'}),body:JSON.stringify({message:'media '+id,content:b64})});
    if(!r.ok){if(r.status===401||r.status===403)askToken();throw{code:'http'+r.status}}
    cache[id]=file;return{id};
  }
};
window.MEDIA=MEDIA;
const DL={async save({filename,data}){const u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};

window.DRHYDRATE=function(){
  document.querySelectorAll('[data-mid]').forEach(el=>{
    if(el.dataset.done)return;el.dataset.done='1';const id=el.dataset.mid;
    MEDIA.blob(id).then(b=>{const u=URL.createObjectURL(b);el.src=u;const a=el.closest('.th')&&el.closest('.th').querySelector('[data-mida]');if(a)a.href=u}).catch(()=>{el.dataset.done=''});
  });
  if(!$('#ghbtn')){const a=$('#app');if(a){const d=document.createElement('div');d.id='ghbtn';d.className='sig';d.innerHTML='<button class="btn" id="ghset">'+(tok()?'Imágenes conectadas · cambiar':'Conectar imágenes')+'</button> <button class="btn" id="impbtn">Importar datos</button> <input type="file" id="impfile" accept="application/json" hidden> <button class="btn" id="outbtn">Salir</button>';a.appendChild(d)}}
};
function askToken(){
  if($('#ghask'))return;
  const d=document.createElement('div');d.id='ghask';
  d.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50';
  d.innerHTML='<div class="card" style="max-width:520px;width:100%"><h3>Conectar imágenes</h3><p class="muted sm">Pegá el token de GitHub (permiso Contents: lectura y escritura sobre el repositorio domino-redes). Queda guardado solo en este dispositivo.</p><input id="ghin" type="password" placeholder="github_pat_…" autocomplete="off"><div class="row" style="margin-top:10px"><button class="btn pri" id="ghok">Guardar</button><button class="btn" id="ghno">Cancelar</button></div></div>';
  document.body.appendChild(d);
  $('#ghok').onclick=()=>{const v=$('#ghin').value.trim();if(v){try{localStorage.setItem('dr_gh',v)}catch(e){}}d.remove();location.reload()};
  $('#ghno').onclick=()=>d.remove();
}
document.addEventListener('click',e=>{
  if(e.target.id==='ghset')askToken();
  if(e.target.id==='outbtn')signOut(auth);
  if(e.target.id==='impbtn')$('#impfile').click();
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='impfile'||!e.target.files[0])return;
  try{
    const j=JSON.parse(await e.target.files[0].text());let n=0;
    for(const col of Object.keys(j))for(const id of Object.keys(j[col])){await DB.doc(col+'/'+id).set(j[col][id]);n++}
    alert('Importación lista: '+n+' registros.');
  }catch(err){alert('No se pudo importar: '+(err.code||err.message||'error'))}
});

/* ---- Acceso con Google ---- */
function login(msg){
  window.DRSHOW('<div class="card" style="max-width:420px;margin:12vh auto;text-align:center"><h1>DOMino Redes</h1><p class="muted">Gestor de redes sociales de The DOM Studio Web</p>'+(msg?'<p style="color:var(--sin)">'+esc(msg)+'</p>':'')+'<button class="btn pri" id="gbtn">Entrar con Google</button><div class="sig">Desarrollado por The DOM Studio Web · WhatsApp 261-3431216</div></div>');
  $('#gbtn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){login('No se pudo iniciar sesión ('+(e.code||'error')+').')}};
}
onAuthStateChanged(auth,u=>{
  if(!u){started=false;login();return}
  if(started)return;started=true;
  window.DRBOOT({user:{email:u.email},db:DB,as:MEDIA,dl:DL});
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
